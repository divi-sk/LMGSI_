<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PokeAPI Converter</title>
</head>
<body>
  <h1>PokeAPI - Conversió JSON ↔ XML</h1>
  <label for="pokemon-name">Nom del Pokémon:</label>
  <input type="text" id="pokemon-name" placeholder="pikachu">
  <button id="show-image">Mostrar Imatge</button>
  <button id="show-abilities">Mostrar Habilitats</button>
  <button id="show-xml">Mostrar XML</button>
  
  <div id="image-container"></div>
  
  <h3>Habilitats:</h3>
  <ul id="abilities-list"></ul>
  
  <h3>XML:</h3>
  <pre id="xml-output"></pre>
  
  <script src="app.js"></script>
</body>
</html>
